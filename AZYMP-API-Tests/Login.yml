info:
  name: Login
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/login"
  body:
    type: json
    data: |-
      {
        "email": "admin@abundancezone.org",
        "password": "ChangeMe123!"
      }
  auth:
    type: bearer
    token: ""

runtime:
  scripts:
    - type: after-response
      code: |-
        // Extract access_token from login response and save as env variable
        const body = res.getBody();

        if (body && body.success && body.data && body.data.access_token) {
            bru.setEnvVar("token", body.data.access_token);
            bru.setEnvVar("refreshToken", body.data.refresh_token);
            bru.setEnvVar("userId", body.data.user.id);
            console.log("✅ Token saved. Expires in " + body.data.expires_in + "s");
        } else {
            console.error("❌ Login failed or response shape changed:", body);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
