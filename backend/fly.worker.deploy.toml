# Abundance Zone Youth Management Platform v2.0 - Celery Worker
app = "abundance-zone-worker"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  WORKER_TYPE = "celery"
  ENVIRONMENT = "production"
  LOG_LEVEL = "info"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[deploy]
  strategy = "rolling"
  max_unavailable = 0.5

# Override default command to run Celery worker
[processes]
  worker = "celery -A app.core.celery_app worker --loglevel=info --concurrency=4"
