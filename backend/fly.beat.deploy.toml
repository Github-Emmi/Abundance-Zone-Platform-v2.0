# Abundance Zone Youth Management Platform v2.0 - Celery Beat Scheduler
app = "abundance-zone-beat"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  WORKER_TYPE = "beat"
  ENVIRONMENT = "production"
  LOG_LEVEL = "info"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

[deploy]
  strategy = "immediate"

# Override default command to run Celery beat
[processes]
  beat = "celery -A app.core.celery_app beat --loglevel=info"
